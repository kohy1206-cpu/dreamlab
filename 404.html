<meta property="og:description" content="50·60, 지금이 AI로 다시 일할 가장 빠른 때입니다. AI강사로 다시 출근하는 길부터 쇼핑쇼츠 수익화, 1:1 맞춤 컨설팅까지 드림랩이 함께합니다.">

<script>
/* 없는 주소로 들어온 경우: dreamlabai.org/yl2 처럼 주소 끝 글자를 유입경로로 기록하고 메인 페이지 맨 위로 이동
   → 새 영상·채널마다 폴더를 만들 필요 없이 dreamlabai.org/아무코드 를 바로 쓸 수 있어요 (영문·숫자·_·- 20자 이내) · 메인 페이지 맨 위에서 시작 */
(function () {
  var seg = location.pathname.split("/").filter(Boolean)[0] || "";
  try { seg = decodeURIComponent(seg); } catch (e) {}
  if (/^[A-Za-z0-9_-]{1,20}$/.test(seg) && !/\.(html?|php|asp)$/i.test(seg)) location.replace("/?from=" + seg.toLowerCase());
  else location.replace("/");
})();
</script>
