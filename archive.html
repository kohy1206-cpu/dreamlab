<script>

var ITEMS = [
  { type:'영상', date:'', level:'실전', topic:'쇼핑쇼츠', title:'쇼핑쇼츠로 돈 벌기', sub:'캡컷과 AI 도구로 만드는 유튜브 쇼핑쇼츠, 조회수 수익 말고 판매 수익을 내는 구조', tags:['캡컷','쇼핑쇼츠','AI 자막'], url:'https://youtu.be/M1g0cAbAKpg', thumb:'img/yt-thumb.jpg' },
  { type:'영상', date:'', level:'입문', topic:'수강생이야기', title:'AI 강사·작가 데뷔, 딱 6개월 걸렸다', sub:'66세 최정화 선생님의 인생역전 인터뷰. 컴맹에서 작가, 시니어 AI 강사가 되기까지', tags:['인터뷰','시니어','작가 데뷔'], url:'https://youtu.be/H26mWjljzX4', thumb:'img/story-choi.jpg' },
  { type:'블로그', date:'2026-01-20', level:'입문', topic:'AI강사', title:'60대 챗맹도 강사 데뷔? 하루 3시간 일하는 AI 강사로', sub:'경험이라는 땅 위에 24시간 일하는 온라인 수익 건물을 올리는 방법', tags:['AI 강사','경력 복귀','온라인 건물주'], url:'https://blog.naver.com/dreamtech_n/224153235547' },
  { type:'블로그', date:'2026-01-14', level:'입문', topic:'수강생이야기', title:'“저 아직 7학년 아닙니다!” 66세 컴맹의 6개월', sub:'나이와 기계에 대한 두려움을 넘어 AI 작가·강사가 된 이야기와 세 가지 메시지', tags:['인터뷰','시니어','동기부여'], url:'https://blog.naver.com/dreamtech_n' },
  { type:'블로그', date:'', level:'실전', topic:'쇼핑쇼츠', title:'AI 강사가 직접 검증한 쇼핑쇼츠 영상 9개 실험', sub:'2025년 초 올린 영상 9개에서 1년째 수익이 나는 과정과 시작 로드맵', tags:['쇼핑쇼츠','무자본','영상 연금'], url:'https://blog.naver.com/dreamtech_n' },
  { type:'특강자료', date:'', level:'실전', topic:'쇼핑쇼츠', title:'쇼핑쇼츠 분야별 핵심 키워드 모음집', sub:'제목·태그 고민 끝. 쇼핑쇼츠 무료특강 참여자에게 드리는 전자책', tags:['전자책','키워드','채널 설정'], url:'index.html#free', ph:'키워드\n모음집' },
  { type:'특강자료', date:'', level:'실전', topic:'쇼핑쇼츠', title:'쇼츠 3초 후킹 대본 템플릿', sub:'이탈률을 줄이는 도입부 대본 틀. 무료특강 참여자 전용', tags:['전자책','대본','후킹'], url:'index.html#free', ph:'3초 후킹\n대본 템플릿' },
  { type:'특강자료', date:'', level:'입문', topic:'쇼핑쇼츠', title:'노란 딱지 ZERO! 쇼츠 채널 정지 방지 매뉴얼', sub:'채널을 안전하게 운영하는 수칙 정리. 무료특강 참여자 전용', tags:['전자책','채널 관리'], url:'index.html#free', ph:'채널 정지\n방지 매뉴얼' },
  { type:'특강자료', date:'', level:'입문', topic:'AI강사', title:'왕초보 AI 강사 필수 도구 7선', sub:'복잡한 건 빼고, 강사 데뷔에 꼭 필요한 도구만 정리한 가이드북', tags:['가이드북','AI 도구'], url:'index.html#free', ph:'AI 강사\n필수 도구 7선' },
  { type:'특강자료', date:'', level:'입문', topic:'AI강사', title:'나만의 디지털 분신 5단계 로드맵', sub:'특강 내용을 한 장으로 요약한 실천 체크리스트', tags:['체크리스트','로드맵'], url:'index.html#free', ph:'디지털 분신\n5단계 로드맵' },
  { type:'특강자료', date:'', level:'입문', topic:'AI기초', title:'강의 커리큘럼 1분 만에 짜 주는 프롬프트', sub:'강사님의 전문성을 커리큘럼으로 바꿔 주는 AI 질문 틀', tags:['프롬프트','커리큘럼'], url:'index.html#free', ph:'커리큘럼\n프롬프트' }
];
(function(){
  var grid=document.getElementById('grid'),q=document.getElementById('q'),empty=document.getElementById('empty');
  var state={type:'전체',topic:'전체',q:''};
  var TYPES=['전체','영상','블로그','특강자료'],TOPICS=['전체','AI강사','쇼핑쇼츠','수강생이야기','AI기초'];
  var LABEL={'수강생이야기':'수강생 이야기','AI강사':'AI 강사','AI기초':'AI 기초','특강자료':'특강 자료'};
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function buttons(el,list,key){list.forEach(function(v){var b=document.createElement('button');b.className='fbtn';b.type='button';b.textContent=LABEL[v]||v;b.setAttribute('aria-pressed',v===state[key]?'true':'false');
    b.onclick=function(){state[key]=v;[].forEach.call(el.querySelectorAll('.fbtn'),function(x){x.setAttribute('aria-pressed','false');});b.setAttribute('aria-pressed','true');draw();};el.appendChild(b);});}
  buttons(document.getElementById('f-type'),TYPES,'type');buttons(document.getElementById('f-topic'),TOPICS,'topic');
  document.getElementById('c-all').textContent=ITEMS.length;
  document.getElementById('c-yt').textContent=ITEMS.filter(function(i){return i.type==='영상';}).length;
  document.getElementById('c-blog').textContent=ITEMS.filter(function(i){return i.type==='블로그';}).length;
  function draw(){
    var k=state.q.trim().toLowerCase();
    var list=ITEMS.filter(function(i){return (state.type==='전체'||i.type===state.type)&&(state.topic==='전체'||i.topic===state.topic)&&(!k||(i.title+i.sub+i.tags.join(' ')+i.topic).toLowerCase().indexOf(k)>=0);});
    grid.innerHTML=list.map(function(i){
      var cls=i.type==='블로그'?'t-blog':(i.type==='특강자료'?'t-gift':'');
      var bcls=i.type==='영상'?'yt':(i.type==='블로그'?'blog':'gift');
      var src=i.type==='영상'?'유튜브':(i.type==='블로그'?'네이버 블로그':'무료특강 선물');
      var th=i.thumb?'<div class="thumb"><img src="'+i.thumb+'" alt="" loading="lazy">'+(i.type==='영상'?'<span class="play"></span>':'')+'</div>':'<div class="thumb ph"><span>'+esc(i.ph||i.title).replace(/\n/g,'<br>')+'</span></div>';
      return '<a class="item '+cls+'" href="'+i.url+'"'+(/^https?:/.test(i.url)?' target="_blank" rel="noopener"':'')+'>'+th+'<div class="body"><div class="meta">'+(i.date?'<time>'+i.date+'</time>':'')+'<span class="badge '+bcls+'">'+src+'</span><span class="badge lv">'+i.level+'</span><span class="badge">'+(LABEL[i.topic]||i.topic)+'</span></div><h3>'+esc(i.title)+'</h3><p>'+esc(i.sub)+'</p><div class="tags">'+i.tags.map(function(t){return '<span>#'+esc(t)+'</span>';}).join('')+'</div></div></a>';
    }).join('');
    empty.classList.toggle('show',!list.length);
  }
  q.addEventListener('input',function(){state.q=q.value;draw();});
  draw();
})();
</script>
